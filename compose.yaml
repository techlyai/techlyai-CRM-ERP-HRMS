name: techly-local

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: techly
      POSTGRES_USER: techly_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techly_owner -d techly"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    shm_size: 128mb

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: ./.local/docker-postgres-password
