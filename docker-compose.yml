# One Dokploy application, using only the backend Git branch.
# The backend service serves BOTH the web interface and its API.
x-techly-build: &techly-build
  context: .
  args:
    NEXT_PUBLIC_DEFAULT_COUNTRY_CODE: ${NEXT_PUBLIC_DEFAULT_COUNTRY_CODE:-91}
    NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    NEXT_PUBLIC_ATTENDANCE_MAP: ${NEXT_PUBLIC_ATTENDANCE_MAP:-}

services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: techly
      POSTGRES_USER: techly_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a random hex secret}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techly_owner -d techly"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: *techly-build
    restart: "no"
    environment:
      DATABASE_ADMIN_URL: postgresql://techly_owner:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/techly
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?Set DATABASE_APP_PASSWORD to a different random hex secret}
      WRITE_RUNTIME_ENV: "false"
    command: ["node", "scripts/run-ts.cjs", "scripts/setup-database.ts"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: *techly-build
    restart: unless-stopped
    expose: ["3000"]
    environment:
      DATABASE_URL: postgresql://techly_app:${DATABASE_APP_PASSWORD:?Set DATABASE_APP_PASSWORD}@postgres:5432/techly
      APP_URL: ${APP_URL:?Set APP_URL to the public HTTPS origin}
      CRON_SECRET: ${CRON_SECRET:?Set a separate cron secret}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@techly.app}
      # Client credentials vault key (64 hex characters). Without it the Credentials tab stays disabled.
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-}
      CREDENTIALS_PREVIOUS_KEYS: ${CREDENTIALS_PREVIOUS_KEYS:-}
      # Optional joining-PDF size ceiling in MB; empty means no limit.
      MAX_JOINING_DOCUMENT_MB: ${MAX_JOINING_DOCUMENT_MB:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt: ["no-new-privileges:true"]

  scheduler:
    build: *techly-build
    restart: unless-stopped
    command: ["node", "scripts/scheduler.cjs"]
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set a separate cron secret}
    depends_on:
      backend:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]

volumes:
  postgres_data:
